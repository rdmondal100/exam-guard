[workspace]
resolver = "2"
members = ["agent/eg-agent", "agent/eg-runner"]

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = true
codegen-units = 1
